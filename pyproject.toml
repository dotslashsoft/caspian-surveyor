[project]
name = "caspian-surveyor"
version = "0.9.8.2"
description = "An exploration companion for Elite Dangerous."
requires-python = ">=3.10"

license = "GPL-3.0-only"
license-files = ["LICENSE"]

dependencies = [
    "keyboard",
    "PySide6",
    "rebound==5.2.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "caspian_surveyor*"
]
[tool.setuptools.package-data]
caspian_surveyor = [
    "assets/fonts/*.ttf",
    "assets/fonts/*.otf",
    "assets/fonts/*.txt"
]