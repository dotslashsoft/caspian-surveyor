name: Build Caspian Surveyor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build Caspian Surveyor
        run: python -m PyInstaller --noconfirm --clean CaspianSurveyor.spec

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "CaspianSurveyor.iss"

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: CaspianSurveyor
          path: dist/CaspianSurveyor/
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: CaspianSurveyor-Installer
          path: installer/CaspianSurveyor-*-Setup.exe
          if-no-files-found: error